; ESP32-S3 N16R8 (16MB flash + 8MB octal PSRAM) Minecraft server
; Edit WiFi credentials in include/globals.h before flashing.
[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
; This board enumerates as /dev/ttyACM0 (QinHeng USB serial). Pin it so the
; uploader doesn't wander off to /dev/ttyS0. Adjust if yours differs.
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; N16R8: 16MB flash, octal PSRAM (PSRAM enabled via sdkconfig.defaults)
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = partitions.csv
